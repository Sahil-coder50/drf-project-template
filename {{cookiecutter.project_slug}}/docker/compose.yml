
services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: sheoran
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  gunicorn:
    build: .
    entrypoint: /project/entrypoint.sh
    environment:
      RUN_MIGRATIONS: "1"
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
    volumes:
      - static_volume:/project/staticfiles
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  daphne:
    build: . 
    entrypoint: /project/entrypoint.sh
    environment:
      RUN_MIGRATIONS: "0"
    command: >
      daphne
      -b 0.0.0.0
      -p 8001
      config.asgi:application
    volumes:
      - static_volume:/project/staticfiles
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always


  celery_worker:
    build: .
    entrypoint: /project/entrypoint.sh
    environment:
      RUN_MIGRATIONS: "0"
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=4
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    restart: always

  celery_beat:
    build: .
    entrypoint: /project/entrypoint.sh
    environment:
      RUN_MIGRATIONS: "0"
    command: >
      celery -A config beat
      --loglevel=info
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8084:80"
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
     - static_volume:/project/staticfiles
    depends_on:
     - gunicorn
     - daphne

volumes:
  postgres_data:
  static_volume:
